[package]
name = "beech-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
beech-core = { path = "../beech-core" }
beech-write = { path = "../beech-write" }
clap = { version = "4.5.38", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
jiff = "0.1"
anyhow = "1.0.98"
csv = "1.3"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tempfile = "3"
beech-sqlite3 = { path = "../beech-sqlite3" }
rusqlite.workspace = true

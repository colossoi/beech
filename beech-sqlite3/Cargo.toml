[package]
name = "beech-sqlite3"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]
loadable_extension = ["rusqlite/loadable_extension"]

[dependencies]
beech-disk = { path = "../beech-disk" }
rusqlite.workspace = true
beech-core = { path = "../beech-core" }
beech-write = { path = "../beech-write" }
arrow-array = "=59.3.0"

[dev-dependencies]
bytes = "1.10"
